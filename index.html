<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Upload Pokemon Excel File</title>
    <style>
      body {
        font-family: 'Arial', sans-serif;
        background-color: #121212;
        color: #e0e0e0;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .container {
        background-color: #1e1e1e;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        text-align: center;
        width: 90%;
        max-width: 400px;
      }
      h1 {
        color: #bb86fc;
      }
      form {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      input[type="file"], input[type="password"] {
        margin: 10px 0;
        width: 100%;
        padding: 10px;
        border: 1px solid #333;
        border-radius: 4px;
        background-color: #2c2c2c;
        color: #e0e0e0;
      }
      input[type="submit"] {
        background-color: #bb86fc;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
      }
      input[type="submit"]:hover {
        background-color: #9b59b6;
      }
      .message {
        margin-top: 20px;
        color: #e0e0e0;
      }
      .debug-info {
        margin-top: 20px;
        background-color: #2c2c2c;
        padding: 10px;
        border-radius: 4px;
        width: 90%;
        max-width: 800px;
        text-align: left;
        font-family: monospace;
        overflow-y: auto;
        max-height: 200px;
        color: #e0e0e0;
      }
      .debug-info pre {
        margin: 0;
      }
      img {
        width: 100%;
        border-radius: 8px;
      }
      @media (max-width: 600px) {
        .container {
          width: 95%;
        }
        .debug-info {
          width: 95%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Gotta Catch Them All</h1>
      <img src="Mewtwo.png" alt="Mewtwo">
      <form id="uploadForm" enctype="multipart/form-data">
        <input type="password" name="passcode" id="passcodeInput" placeholder="Enter passcode" required>
        <input type="file" name="file" id="fileInput" required>
        <input type="submit" value="Upload">
      </form>
      <div class="message" id="message"></div>
    </div>
    <div class="debug-info" id="debugInfo">
      <h2>🐞 → 🚀</h2>
      <pre id="debugOutput"></pre>
    </div>

    <script>
      document.getElementById('uploadForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const passcodeInput = document.getElementById('passcodeInput');
        const fileInput = document.getElementById('fileInput');
        const passcode = passcodeInput.value;
        const file = fileInput.files[0];
        const messageDiv = document.getElementById('message');
        const debugOutput = document.getElementById('debugOutput');

        if (false) {
          messageDiv.textContent = 'Invalid passcode.';
          debugOutput.textContent = 'Error: Invalid passcode.';
          return;
        }

        if (file) {
          const formData = new FormData();
          formData.append('file', file);
          debugOutput.textContent = 'File uploaded successfully. Processing...';

          const response = await fetch('/upload', {
            method: 'POST',
            body: formData
          });

          const result = await response.json();
          if (response.ok) {
            messageDiv.textContent = result.message;
            debugOutput.textContent = 'File processed successfully';
          } else {
            messageDiv.textContent = result.error;
            debugOutput.textContent = 'Error: ' + result.error;
          }
        }
      });
    </script>
  </body>
</html>
